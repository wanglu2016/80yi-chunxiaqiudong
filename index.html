<h2>这张地球仪里，什么是真的，什么是估的</h2>
<p>页面里每个数字旁边都有一个小标记。同一屏里混着四种东西，读的时候要分开看。</p>
<div class="tw"><table>
<tr><th>标记</th><th>是什么</th><th>例子</th><th>可信程度</th></tr>
<tr><td><span class="tag" data-k="实">实</span></td><td>统计或观测数据</td><td>世界人口、城市人口、年龄结构、时区规则、公共假期、常年气温</td><td>有明确来源，但各有口径和年份</td></tr>
<tr><td><span class="tag" data-k="算">算</span></td><td>天文公式算出</td><td>太阳直射点、日出日落、昼长、太阳高度</td><td>和天文库对比，日出日落误差约 1 分钟内</td></tr>
<tr><td><span class="tag" data-k="估">估</span></td><td>模型估算</td><td>白昼人口、八类人的规模、各类人此刻在做什么</td><td>只能看大致比例，城市之间的细小差别没有意义</td></tr>
<tr><td><span class="tag" data-k="画">画</span></td><td>动画表现</td><td>光点的具体位置、光点颜色和明暗</td><td>不代表真实个人</td></tr>
</table></div>
<p>光点变暗只说明太阳落山。那里的人可能在吃晚饭、加班或看电视。在“在做什么”主题下，每个光点按所在地的估算比例抽一种活动，用来显示比例，不是在追踪任何人。这里没有任何实时用户数据。</p>

<h3>八类人怎么算</h3>
<p>先用联合国 2026 年预测的全国年龄结构，分出 0–5 岁、6–17 岁、18–24 岁、25–64 岁和 65 岁以上。再用世界银行整理的就业率、15–64 岁劳动参与率、入学率和弱势就业比例，拆成婴幼儿、中小学生、大学生、固定班上班族、轮班工作者、个体与灵活就业、在家的成年人、退休老人。</p>
<ul>
<li>城市用的是所在国的结构，没有单独的城市年龄数据，所以东京和秋田在模型里年龄结构相同。</li>
<li>个体与灵活就业的比例，用“弱势就业”扣掉农业后估算，这样更接近城市。</li>
<li>雇员中 16% 算作轮班，取自美国劳工统计局 2017–2018 年非白天班的比例，各国通用。这是一个粗略假设。</li>
</ul>

<h3>一天怎么排</h3>
<p>每类人有几种典型的一天，比如工作日、休息日、早中晚三种轮班。每个环节的开始时间都有分散度，所以比例是平滑变化的。起床、就寝、上下班时间，美国、加拿大、西班牙、意大利、法国、英国、爱尔兰、丹麦来自时间利用调查，其他欧洲国家的就寝时间来自欧洲统一调查。其余地区按 18 种作息类型设定，是我根据公开资料做的假设。</p>
<p>通勤单程按城市大小和地区取 20 到 50 分钟左右。午饭、晚饭、上学时间同样是地区假设。</p>

<h3>季节怎样进入模型</h3>
<ul>
<li>昼夜：太阳位置逐分钟计算，夏令时按 2026 年规则切换。</li>
<li>睡眠：夜越长，模型里睡得越久。冬夏差约 30–60 分钟，依据手机通话间隙研究的量级。</li>
<li>午休：有午休习惯的地区，天气越热午休比例越高。</li>
<li>学校放假：按地区近似，不是每所学校的真实校历。</li>
<li>公共假期：按 2026 年各国法定假期。中国含调休上班日。伊斯兰节日日期为预估，实际以当地宣布为准。</li>
<li>斋月：穆斯林人口占多数的国家，一部分成年人切换到斋月作息，开斋时间跟随当地日落。比例是假设值。</li>
</ul>

<h3>模型和调查差多少</h3>
<p>下面是模型算出的平均每天小时数，和时间利用调查的对比。调查的年份、年龄范围和分类都不完全相同，这张表只用来判断量级。</p>
<div class="tw"><table><tr><th>对象</th><th>活动</th><th class="num">模型</th><th class="num">调查</th><th>调查来源</th></tr><tr><td>全球，全年龄</td><td>睡觉和躺床</td><td class="num">9.0</td><td class="num">9.1</td><td>The global human day</td></tr><tr><td>全球，全年龄</td><td>工作</td><td class="num">2.6</td><td class="num">2.6</td><td>The global human day</td></tr><tr><td>全球，全年龄</td><td>上学学习</td><td class="num">1.1</td><td class="num">1.1</td><td>The global human day</td></tr><tr><td>美国，15 岁以上</td><td>睡觉</td><td class="num">8.7</td><td class="num">9.0</td><td>ATUS 2025</td></tr><tr><td>美国，15 岁以上</td><td>休闲</td><td class="num">6.1</td><td class="num">5.2</td><td>ATUS 2025</td></tr><tr><td>中国，成年人</td><td>睡觉+吃饭洗漱</td><td class="num">11.2</td><td class="num">11.9</td><td>2018 调查，生理必需活动</td></tr><tr><td>中国，成年人</td><td>工作</td><td class="num">3.7</td><td class="num">4.4</td><td>2018 调查</td></tr><tr><td>中国，成年人</td><td>家务照料</td><td class="num">2.5</td><td class="num">2.7</td><td>2018 调查，无酬劳动</td></tr><tr><td>日本，15–64 岁</td><td>工作、学习和通勤</td><td class="num">6.1</td><td class="num">6.1</td><td>OECD / JILPT，2021</td></tr><tr><td>韩国，15–64 岁</td><td>工作、学习和通勤</td><td class="num">5.6</td><td class="num">5.7</td><td>OECD / JILPT，2014</td></tr><tr><td>德国，15–64 岁</td><td>工作、学习和通勤</td><td class="num">4.9</td><td class="num">4.1</td><td>OECD / JILPT，2012/13</td></tr><tr><td>法国，15–64 岁</td><td>工作、学习和通勤</td><td class="num">4.8</td><td class="num">3.4</td><td>OECD / JILPT，2009/10</td></tr></table></div>
<p>模型的休闲时间普遍偏多约 1 小时，部分原因是调查里单列的个人护理、等待和其他杂项，在模型里归到了休闲。</p>

<h3>城市怎么选</h3>
<p>共 441 座城市，覆盖 199 个国家和地区。联合国 2025 年列出的 33 座千万人口城市全部入选，人口 500 万以上的 49 座也全部入选，其他城市按国家人口选代表。</p>
<p>分线按页面显示的人口：一线 1000 万以上，二线 300–1000 万，三线 100–300 万，四线 100 万以下。这是本页为了全球比较用的规则，不同于中国常说的城市分线。</p>
<p>口径要注意。联合国这版按连续的高密度建成区统计，所以雅加达有 4191 万，而重庆只有 707 万，都和行政辖区人口差别很大。没有进入联合国 500 万以上名单的城市，用 Natural Earth 汇编的都市区人口，年份不一，部分明显偏旧。两种口径的数字不宜直接比较。</p>

<h3>这张图不能回答什么</h3>
<ul>
<li>模型描述常态的一天。战争、灾害、停电、大型活动都不在其中，所以它对正在经历危机的城市是错的。</li>
<li>农村人口、农业季节和流动人口的节奏没有细分。全球统计把所有人都放进同一套模型。</li>
<li>世界人口取联合国 2024 版预测。人口网格只用来分配空间位置，总量按各国 2026 年人口校正。</li>
<li>87 座城市附近没有合适的气温数据，卡片上会直接说明。其他城市的气温是常年月均值，不是当天天气。</li>
</ul>
